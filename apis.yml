aid: quantemplate
name: QuanTemplate
description: >-
  Quantemplate is a data integration and management platform for the insurance
  industry. It automatically translates, validates, and enriches business-critical
  data across enterprise networks - connecting insurers, brokers, MGAs, and partners
  in a secure real-time data network. Its no-code environment lets business users
  build data-preparation workflows with AI-assisted mapping, full audit trails,
  permissions, and version history, plus dashboards and reporting. The FabricAPI
  automates data ingress and egress - run preconfigured pipelines and download the
  resulting datasets as CSV. Bordereaux management is a marquee solution, and the
  platform is used by insurers including Sompo, AXA, and Falls Lake Insurance.
